<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSPHONE eFootball - OBS Animated Stream Overlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Strict OBS Transparent Canvas Configuration */
        html, body {
            background-color: transparent !important;
            background: none !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 1. Gentle Floating Breathing Motion */
        .overlay-floating-container {
            animation: floatBreathing 4.5s ease-in-out infinite;
            filter: drop-shadow(0 12px 30px rgba(0, 229, 255, 0.35)) drop-shadow(0 -6px 20px rgba(255, 0, 128, 0.25));
        }

        @keyframes floatBreathing {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.004); }
        }

        /* 2. Shimmer Light Sweep Effect Across Banner */
        .shimmer-sweep {
            position: absolute;
            top: -20%;
            left: -150%;
            width: 50%;
            height: 140%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(0, 229, 255, 0.15) 25%,
                rgba(255, 255, 255, 0.85) 50%,
                rgba(255, 0, 128, 0.2) 75%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-28deg);
            pointer-events: none;
            mix-blend-mode: color-dodge;
            animation: lightSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 20;
        }

        @keyframes lightSweep {
            0% { left: -150%; }
            30%, 100% { left: 180%; }
        }

        /* 3. Pulsing Neon Outline Aura Glow */
        .neon-frame-aura {
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 15px #00e5ff, 0 0 30px rgba(255, 0, 128, 0.6);
            animation: auraPulse 2.5s ease-in-out infinite alternate;
            z-index: 5;
        }

        @keyframes auraPulse {
            0% { opacity: 0.4; filter: blur(2px); }
            100% { opacity: 0.95; filter: blur(6px); }
        }

        /* 4. Left Logo Pulsing Neon Ring Highlight */
        .logo-ring-glow {
            position: absolute;
            top: 50%;
            left: 8.8%;
            transform: translate(-50%, -50%);
            width: 14.5%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 3px solid rgba(0, 229, 255, 0.8);
            box-shadow: 0 0 15px #00e5ff, inset 0 0 10px #ff0080;
            animation: ringPulse 2s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: screen;
        }

        @keyframes ringPulse {
            0% { transform: translate(-50%, -50%) scale(0.96); box-shadow: 0 0 8px #00e5ff, inset 0 0 5px #ff0080; opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.04); box-shadow: 0 0 25px #00e5ff, 0 0 15px #ff0080, inset 0 0 15px #00e5ff; opacity: 1; }
        }

        /* 5. Blinking Recording Dot on MediaShare Button */
        .mediashare-indicator {
            position: absolute;
            top: 48%;
            right: 17.1%;
            transform: translate(50%, -50%);
            width: 1.1%;
            aspect-ratio: 1 / 1;
            background-color: #ff0055;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            animation: indicatorBlink 0.9s ease-in-out infinite alternate;
        }

        @keyframes indicatorBlink {
            0% { opacity: 0.2; transform: translate(50%, -50%) scale(0.7); box-shadow: 0 0 2px #ff0055; }
            100% { opacity: 1; transform: translate(50%, -50%) scale(1.3); box-shadow: 0 0 12px #ff0055, 0 0 22px #ff0080; }
        }

        /* Foreground Canvas for Floating Cyber Particles */
        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            mix-blend-mode: screen;
        }

        /* Custom Image Fallback / Status Message Overlay */
        .status-badge {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00e5ff;
            font-family: sans-serif;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Main Container With Floating Animation -->
    <div class="relative w-full max-w-[1200px] px-4 overlay-floating-container">

        <!-- Outer Glowing Frame Aura -->
        <div class="neon-frame-aura"></div>

        <!-- Main Banner Canvas Frame -->
        <div class="relative w-full rounded-xl overflow-hidden shadow-2xl flex items-center justify-center">

            <!-- EXACT ORIGINAL OVERLAY IMAGE (Base Layer) -->
            <img 
                id="mainOverlayImg"
                src="idsphone_overlay.png" 
                alt="IDSPHONE eFootball Stream Overlay" 
                class="w-full h-auto object-contain block relative z-10"
                onerror="handleImgError(this)"
            />

            <!-- Animated Layer 1: Shimmer Sweep Light -->
            <div class="shimmer-sweep"></div>

            <!-- Animated Layer 2: Pulsing Logo Glow Overlay -->
            <div class="logo-ring-glow"></div>

            <!-- Animated Layer 3: MediaShare Recording Dot Indicator -->
            <div class="mediashare-indicator"></div>

            <!-- Animated Layer 4: Interactive Floating Cyber Particles -->
            <canvas id="particleCanvas"></canvas>

        </div>

        <!-- Helper Badge for OBS Users -->
        <div id="statusInfo" class="status-badge opacity-0 hover:opacity-100 transition-opacity">
            <i class="fa-solid fa-circle-check text-green-400 mr-1"></i> Overlay Gambar Asli Aktif (OBS Ready)
        </div>

    </div>

    <!-- JavaScript Particle Engine & Local Image Handler -->
    <script>
        // Image Error Handler with Automatic Local Fallback
        function handleImgError(img) {
            console.warn("Gambar 'idsphone_overlay.png' tidak ditemukan di lokasi saat ini. Mengirim permintaan pencarian ulang nama file...");
            // Try alternative filenames if user named it differently in the local OBS folder
            const fallbacks = ['idsphone_overlay.jpg', 'idsphone_overlay_2.jpg', 'overlay.jpg'];
            let currentIdx = parseInt(img.getAttribute('data-fallback-idx') || '0');
            
            if (currentIdx < fallbacks.length) {
                img.setAttribute('data-fallback-idx', currentIdx + 1);
                img.src = fallbacks[currentIdx];
            } else {
                const statusInfo = document.getElementById('statusInfo');
                statusInfo.classList.remove('opacity-0');
                statusInfo.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400 mr-1"></i> Pastikan file gambar <b>idsphone_overlay.png</b> berada dalam 1 folder dengan file HTML ini.`;
            }
        }

        // Cyber Particle Animation System
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        class CyberParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 2.8 + 1.0;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = -(Math.random() * 0.9 + 0.4);
                this.color = Math.random() > 0.4 ? '#00e5ff' : '#ff0080';
                this.alpha = Math.random() * 0.8 + 0.2;
                this.decay = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;

                if (this.alpha <= 0 || this.y < -10 || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function initParticles() {
            particles = Array.from({ length: 45 }, () => new CyberParticle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.onload = () => {
            resizeCanvas();
            initParticles();
            animateParticles();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });
        };
    </script>
</body>
</html>
