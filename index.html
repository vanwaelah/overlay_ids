<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idsphone Overlay - Side Motion</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:transparent}
.banner{
 position:absolute;left:1%;top:12%;width:98%;
 animation:sideMove 4.6s ease-in-out infinite,glowPulse 3.4s ease-in-out infinite;
 transform:translateX(0);will-change:transform,filter;
}
.banner img{display:block;width:100%;height:auto}
.shine{
 position:absolute;top:4%;bottom:4%;left:-25%;width:16%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),rgba(255,255,255,.72),rgba(0,217,255,.3),transparent);
 transform:skewX(-22deg);filter:blur(2px);mix-blend-mode:screen;
 animation:shineMove 5.2s ease-in-out infinite;
}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:white;
 box-shadow:0 0 10px 3px #00d9ff;opacity:0;top:45%;left:-2%;
 animation:sparkMove 4.5s linear infinite}
.spark.pink{top:66%;animation-delay:1.5s;box-shadow:0 0 10px 3px #ff159b}
@keyframes sideMove{
 0%,100%{transform:translateX(-10px)}
 50%{transform:translateX(10px)}
}
@keyframes glowPulse{
 0%,100%{filter:drop-shadow(0 0 4px rgba(0,217,255,.18))}
 50%{filter:drop-shadow(0 0 12px rgba(0,217,255,.4)) drop-shadow(0 0 5px rgba(255,21,155,.24))}
}
@keyframes shineMove{
 0%,8%{left:-25%;opacity:0}
 18%{opacity:.85}
 65%{left:112%;opacity:.7}
 66%,100%{left:112%;opacity:0}
}
@keyframes sparkMove{
 0%{transform:translateX(0) scale(.2);opacity:0}
 12%{opacity:.85}
 85%{opacity:.65}
 100%{transform:translateX(105vw) scale(1);opacity:0}
}
@media(max-aspect-ratio:4/3){.banner{width:120%;left:-10%;top:18%}}
</style>
</head>
<body>
<div class="stage">
 <div class="banner">
  <img src="idsphone_overlay.png" alt="Idsphone eFootball stream overlay">
  <div class="shine"></div>
 </div>
 <i class="spark"></i><i class="spark pink"></i>
</div>
</body>
</html>
