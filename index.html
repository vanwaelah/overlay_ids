<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idsphone Animated Overlay</title>
<style>
:root { --cyan:#00d9ff; --pink:#ff159b; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent !important; }
body { font-family:Arial,sans-serif; }
.stage { position:relative; width:100vw; height:100vh; overflow:hidden; background:transparent; pointer-events:none; }
.banner {
  position:absolute; top:3%; left:1%; width:98%; transform-origin:center;
  animation: float 3.2s ease-in-out infinite, glow 2.4s ease-in-out infinite;
  will-change:transform,filter;
}
.banner img { display:block; width:100%; height:auto; }
.sweep {
  position:absolute; top:6%; bottom:6%; left:-25%; width:17%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),rgba(255,255,255,.72),rgba(0,217,255,.28),transparent);
  transform:skewX(-22deg);
  mix-blend-mode:screen;
  filter:blur(3px);
  animation: sweep 4.5s linear infinite;
}
.ring-glow {
  position:absolute; inset:10% 2%;
  border-radius:30px;
  background:linear-gradient(105deg,rgba(0,217,255,.16),transparent 30%,rgba(255,21,155,.15) 70%,transparent);
  opacity:.35;
  mix-blend-mode:screen;
  animation: pulse 1.8s ease-in-out infinite;
}
.spark {
  position:absolute; width:9px;height:9px;border-radius:50%;
  background:#fff; box-shadow:0 0 12px 4px var(--cyan);
  top:40%; left:-2%; opacity:0;
  animation: spark 3.4s ease-in-out infinite;
}
.spark.s2 { top:70%; animation-delay:1.1s; box-shadow:0 0 12px 4px var(--pink); }
.spark.s3 { top:27%; animation-delay:2.1s; width:6px;height:6px; }
@keyframes float {
  0%,100% { transform:translateY(0) scale(1); }
  50% { transform:translateY(-12px) scale(1.008); }
}
@keyframes glow {
  0%,100% { filter:drop-shadow(0 0 5px rgba(0,217,255,.2)); }
  50% { filter:drop-shadow(0 0 16px rgba(0,217,255,.58)) drop-shadow(0 0 8px rgba(255,21,155,.35)); }
}
@keyframes sweep {
  0% { left:-25%; opacity:0; }
  8% { opacity:.9; }
  55% { left:110%; opacity:.8; }
  56%,100% { left:110%; opacity:0; }
}
@keyframes pulse { 0%,100% {opacity:.12;transform:scale(.99)} 50% {opacity:.7;transform:scale(1.01)} }
@keyframes spark {
  0% { transform:translateX(0) scale(.2);opacity:0; }
  12% { opacity:.95; }
  70% { transform:translateX(100vw) scale(1.3);opacity:.6; }
  100% { transform:translateX(110vw) scale(.1);opacity:0; }
}
@media (max-aspect-ratio:4/3) { .banner { width:120%;left:-10%;top:6%; } }
</style>
</head>
<body>
<div class="stage">
  <div class="banner">
    <img src="idsphone_overlay.png" alt="Idsphone eFootball overlay">
    <div class="ring-glow"></div>
    <div class="sweep"></div>
    <div class="spark"></div><div class="spark s2"></div><div class="spark s3"></div>
  </div>
</div>
</body>
</html>
